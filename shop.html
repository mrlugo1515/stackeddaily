<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=store.html" />
  <link rel="canonical" href="https://www.stackeddaily.org/store.html" />
  <title>Redirecting...</title>
  <script>window.location.replace("store.html");</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1521824556709351" crossorigin="anonymous"></script>
</head>
<body>
  <p>Redirecting to the store... <a href="store.html">Click here if not redirected.</a></p>
  <!-- Back to top -->
  <button class="back-to-top" id="btt" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
    (function(){
      var btn = document.getElementById('btt');
      if(!btn) return;
      window.addEventListener('scroll', function(){
        btn.classList.toggle('visible', window.scrollY > 400);
      }, {passive:true});
    })();
  </script>
</body>
</html>
