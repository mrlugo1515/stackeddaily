<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You! — StackedDaily</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='9' fill='%231C1C1C'/><rect x='8' y='9' width='20' height='3.5' rx='1.75' fill='%23C9A84C'/><rect x='8' y='16' width='13' height='3.5' rx='1.75' fill='%23C9A84C'/><rect x='8' y='23' width='17' height='3.5' rx='1.75' fill='%23C9A84C'/></svg>" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #F5F0E8; }
    .ty-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .ty-card {
      background: #ffffff;
      border: 1.5px solid #D4CCB8;
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(28,20,10,.1);
    }
    .ty-icon { font-size: 4rem; margin-bottom: 1.25rem; }
    .ty-card h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -.03em;
      color: #1C1C1C;
      margin-bottom: .75rem;
    }
    .ty-card > p {
      color: #5a5040;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .download-box {
      background: #FAF7F0;
      border: 2px solid #C9A84C;
      border-radius: 16px;
      padding: 1.75rem;
      margin: 2rem 0;
    }
    .download-box h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1C1C1C;
      margin-bottom: .4rem;
    }
    .download-box p {
      font-size: .9rem;
      color: #5a5040;
      margin-bottom: 1.25rem;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      padding: .9rem 1.5rem;
      background: #C9A84C;
      color: #1C1C1C;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 12px;
      text-decoration: none;
      transition: background .15s, transform .15s;
    }
    .btn-download:hover { background: #b8973b; transform: translateY(-1px); }
    .download-tracked { position: relative; }
    .download-tracked::after {
      content: '✓ Download started';
      display: none;
      position: absolute;
      bottom: -1.75rem;
      left: 50%; transform: translateX(-50%);
      font-size: .8rem; color: #437A22; font-weight: 700; white-space: nowrap;
    }
    .download-tracked.done::after { display: block; }
    .ty-footer-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }
    .ty-footer-links a {
      font-size: .9rem;
      color: #5a5040;
      text-decoration: none;
    }
    .ty-footer-links a:hover { color: #C9A84C; }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1521824556709351" crossorigin="anonymous"></script>
</head>
<body>
  <div class="ty-page">
    <div class="ty-card">
      <div class="ty-icon">🎉</div>
      <h1 id="ty-headline">Payment Successful!</h1>
      <p id="ty-intro">Your purchase is confirmed. Download your file below — it's ready instantly.</p>

      <div class="download-box" id="download-box">
        <h2 id="product-name">Your Download</h2>
        <p>Click below to save the file to your phone or computer.</p>
        <a href="#" id="download-link" class="btn-download download-tracked">⬇ Download Now</a>
      </div>

      <p style="font-size:.88rem;color:#9a8e78">
        Questions? Email <a href="mailto:hello@stackeddaily.org" style="color:#C9A84C;font-weight:700">hello@stackeddaily.org</a> — we respond within 24 hrs.
      </p>

      <div class="ty-footer-links">
        <a href="store.html">← Back to Store</a>
        <a href="index.html">Home</a>
        <a href="blog.html">Free Guides</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ── Product map ──────────────────────────────────────────
      const products = {
        toolkit: { name: 'The $0 AI Toolkit Guide',        file: 'ai-toolkit-guide.pdf',      price: 9  },
        notion:  { name: 'Notion Side Hustle Dashboard',   file: 'notion-dashboard-guide.pdf', price: 17 }
      };

      // ── Parse URL params ──────────────────────────────────────
      const params  = new URLSearchParams(window.location.search);
      const product = params.get('product');
      const name    = params.get('name') || 'Customer';
      const p       = products[product];

      // ── Personalise heading ──────────────────────────────────
      if (name && name !== 'Customer') {
        document.getElementById('ty-headline').textContent = 'Thank you, ' + name + '!';
      }

      // ── Set download link ────────────────────────────────────
      if (p) {
        document.getElementById('product-name').textContent = p.name;
        const link = document.getElementById('download-link');
        link.href     = p.file;
        link.download = p.file;
        link.textContent = '⬇ Download ' + p.name;

        // ── Track download click ─────────────────────────────
        link.addEventListener('click', function () {
          link.classList.add('done');
          trackEvent('download', { product: p.name, file: p.file });
        });
      }

      // ── Fire sale tracking on page load ─────────────────────
      // thank-you.html is noindex and only reachable after PayPal onApprove
      if (p) {
        trackEvent('sale', {
          product:    p.name,
          price:      p.price,
          currency:   'USD',
          customerName: name,
          productKey: product
        });
      }

      // ── Track helper ─────────────────────────────────────────
      function trackEvent(type, data) {
        try {
          fetch('/api/track', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type,
              ...data,
              page:      window.location.href,
              userAgent: navigator.userAgent,
              clientTime: new Date().toISOString()
            })
          });
        } catch (e) { /* silent — tracking must never break the download */ }
      }
    })();
  </script>

  <!-- Back to top -->
  <button class="back-to-top" id="btt" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
    (function(){
      var btn = document.getElementById('btt');
      if(!btn) return;
      window.addEventListener('scroll', function(){
        btn.classList.toggle('visible', window.scrollY > 400);
      }, {passive:true});
    })();
  </script>
</body>
</html>
